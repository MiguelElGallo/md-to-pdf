name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests
        run: |
          cargo test --locked
          python -m unittest discover -s mcp_server -p "test_*.py"

      - name: Build install journey fixture
        run: cargo build --locked

      - name: Test isolated plugin install, conversion, and upgrade
        env:
          MD_TO_PDF_RUN_INSTALL_JOURNEY: "1"
          MD_TO_PDF_JOURNEY_BINARY: ${{ github.workspace }}/target/debug/md-to-pdf${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest mcp_server.test_install_journey -v

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [[ -z "$browser" ]]; then
            echo "No Chromium-family browser found"
            exit 1
          fi
          echo "path=$browser" >> "$GITHUB_OUTPUT"

      - name: Run browser smoke tests
        env:
          MD_TO_PDF_BROWSER: ${{ steps.chrome.outputs.path }}
        run: cargo test --locked browser_smoke -- --nocapture --test-threads=1

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Check Python lint and types
        run: |
          uvx ruff==0.16.6 check mcp_server plugins/md-to-pdf/mcp_server plugins/md-to-pdf-copilot/mcp_server
          uvx ty==0.0.78 check mcp_server plugins/md-to-pdf/mcp_server plugins/md-to-pdf-copilot/mcp_server

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build documentation
        run: uv run --locked --group docs zensical build --clean --strict

  required-checks-passed:
    name: All required jobs passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - lint
      - workflow-lint
      - test
      - browser-smoke
      - python-quality
      - docs
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [[ -n "$failing" ]]; then
            echo "$failing"
            exit 1
          fi
