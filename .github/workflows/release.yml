name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1. Use dry-run to build artifacts without publishing."
        required: true
        default: dry-run
        type: string
      allow_unsigned_macos:
        description: "Allow publishing without Apple Developer ID signing/notarization."
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: md-to-pdf

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      publishing: ${{ steps.plan.outputs.publishing }}
      macos_signing: ${{ steps.signing.outputs.macos_signing }}
      allow_unsigned_macos: ${{ steps.plan.outputs.allow_unsigned_macos }}
    steps:
      - name: Determine release mode
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ALLOW_UNSIGNED_MACOS: ${{ inputs.allow_unsigned_macos || false }}
        run: |
          set -euo pipefail
          allow_unsigned_macos="$INPUT_ALLOW_UNSIGNED_MACOS"
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            allow_unsigned_macos="false"
          else
            tag="$INPUT_TAG"
          fi

          if [[ "$allow_unsigned_macos" != "true" && "$allow_unsigned_macos" != "false" ]]; then
            echo "allow_unsigned_macos must be true or false" >&2
            exit 1
          fi

          publishing=false
          ref="${GITHUB_SHA}"
          version="dry-run"
          if [[ "$tag" != "dry-run" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must look like v0.1.1 or v0.1.1-rc.1" >&2
              exit 1
            fi
            publishing=true
            version="${tag#v}"
            ref="refs/tags/$tag"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "ref=$ref"
            echo "publishing=$publishing"
            echo "allow_unsigned_macos=$allow_unsigned_macos"
          } >> "$GITHUB_OUTPUT"

      - name: Check macOS signing availability
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          macos_signing=false
          if [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_DEVELOPER_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            macos_signing=true
          fi
          echo "macos_signing=$macos_signing" >> "$GITHUB_OUTPUT"

  validate-release:
    name: Validate release
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-13
        with:
          components: clippy,rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate Cargo version matches tag
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "md-to-pdf") | .version')
          plugin_version=$(jq -r '.version' plugin.json)
          portable_plugin_version=$(jq -r '.version' plugins/md-to-pdf/plugin.json)
          codex_plugin_version=$(jq -r '.version' plugins/md-to-pdf/.codex-plugin/plugin.json)
          copilot_marketplace_version=$(jq -r '.metadata.version' .github/plugin/marketplace.json)
          server_version=$(sed -n 's/^SERVER_VERSION = "\([^"]*\)"/\1/p' mcp_server/server.py)
          binary_version=$(sed -n 's/^BINARY_VERSION = "\([^"]*\)"/\1/p' mcp_server/server.py)
          packaged_server_version=$(sed -n 's/^SERVER_VERSION = "\([^"]*\)"/\1/p' plugins/md-to-pdf/mcp_server/server.py)
          expected="${{ needs.plan.outputs.version }}"
          if [[ "$cargo_version" != "$expected" || "$plugin_version" != "$expected" || "$portable_plugin_version" != "$expected" || "$codex_plugin_version" != "$expected" || "$copilot_marketplace_version" != "$expected" || "$server_version" != "$expected" || "$binary_version" != "$expected" || "$packaged_server_version" != "$expected" ]]; then
            echo "Release versions do not match tag ${{ needs.plan.outputs.tag }}:"
            echo "  Cargo.toml: $cargo_version"
            echo "  plugin.json: $plugin_version"
            echo "  portable plugin: $portable_plugin_version"
            echo "  Codex plugin: $codex_plugin_version"
            echo "  Copilot marketplace: $copilot_marketplace_version"
            echo "  MCP server: $server_version"
            echo "  downloaded binary: $binary_version"
            echo "  packaged MCP server: $packaged_server_version"
            exit 1
          fi

      - name: Validate macOS signing policy
        if: ${{ needs.plan.outputs.publishing == 'true' && needs.plan.outputs.macos_signing != 'true' && needs.plan.outputs.allow_unsigned_macos != 'true' }}
        shell: bash
        run: |
          echo "Publishing without signed/notarized macOS artifacts is disabled."
          echo "Configure Apple signing secrets, or manually dispatch with allow_unsigned_macos=true for an explicitly unsigned release."
          exit 1

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: Run release checks
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 -m unittest discover -s mcp_server -p "test_*.py"
          uv run --locked --group docs zensical build --clean --strict

  build:
    name: Build ${{ matrix.target }}
    needs:
      - plan
      - validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: md-to-pdf
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: zip
            binary: md-to-pdf
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: zip
            binary: md-to-pdf
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: md-to-pdf.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-13
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke-test unsigned macOS binary
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --help

      - name: Package archive
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          staging="target/distrib/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp README.md LICENSE "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'target/distrib/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}' -DestinationPath 'target/distrib/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.zip' -Force"
          else
            chmod +x "$staging/${{ matrix.binary }}"
            tar -czf "target/distrib/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.tar.gz" -C target/distrib "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          fi

      - name: Generate checksums
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./*.${{ matrix.archive }} > "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.sha256"
          else
            shasum -a 256 ./*.${{ matrix.archive }} > "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.sha256"
          fi

      - name: Verify packaged artifact
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.sha256"
          else
            shasum -a 256 -c "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.sha256"
          fi
          verify_dir="$RUNNER_TEMP/release-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell.exe -NoProfile -Command "Expand-Archive -Path '${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.zip' -DestinationPath '$verify_dir' -Force"
          else
            tar -xzf "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.tar.gz" -C "$verify_dir"
          fi
          binary="$verify_dir/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}/${{ matrix.binary }}"
          test -f "$binary"
          "$binary" --version
          "$binary" --help

      - name: Upload artifacts
        if: ${{ runner.os != 'macOS' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/distrib/*.${{ matrix.archive }}
            target/distrib/*.sha256

      - name: Upload unsigned macOS binary
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            README.md
            LICENSE

  package-macos:
    name: Sign and package ${{ matrix.target }}
    needs:
      - plan
      - validate-release
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download unsigned macOS binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-${{ matrix.target }}
          path: unsigned

      - name: Import Developer ID certificate
        if: ${{ needs.plan.outputs.macos_signing == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/md-to-pdf-signing.keychain-db"
          cert="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"

      - name: Sign macOS binary
        if: ${{ needs.plan.outputs.macos_signing == 'true' }}
        shell: bash
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          set -euo pipefail
          binary="unsigned/target/${{ matrix.target }}/release/${BIN_NAME}"
          chmod +x "$binary"
          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" "$binary"
          codesign -vvv --strict "$binary"
          codesign -dvv "$binary"

      - name: Package macOS archive
        shell: bash
        run: |
          set -euo pipefail
          binary="unsigned/target/${{ matrix.target }}/release/${BIN_NAME}"
          chmod +x "$binary"
          staging="target/distrib/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp unsigned/README.md unsigned/LICENSE "$staging/"
          cp "$binary" "$staging/"
          (cd target/distrib && zip -r "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.zip" "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}")

      - name: Notarize macOS archive
        if: ${{ needs.plan.outputs.macos_signing == 'true' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          archive="target/distrib/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.zip"
          xcrun notarytool submit "$archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Verify macOS trust
        if: ${{ needs.plan.outputs.macos_signing == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          binary="unsigned/target/${{ matrix.target }}/release/${BIN_NAME}"
          codesign -vvv --strict "$binary"

      - name: Remove signing keychain
        if: ${{ always() && needs.plan.outputs.macos_signing == 'true' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/md-to-pdf-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Generate macOS checksum
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib
          shasum -a 256 ./*.zip > "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.sha256"
          shasum -a 256 -c "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.sha256"

      - name: Verify packaged macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib
          verify_dir="$RUNNER_TEMP/release-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip "${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.zip" -d "$verify_dir"
          binary="$verify_dir/${BIN_NAME}-${{ needs.plan.outputs.tag }}-${{ matrix.target }}/${BIN_NAME}"
          test -f "$binary"
          chmod +x "$binary"
          if [[ "${{ needs.plan.outputs.macos_signing }}" == "true" ]]; then
            codesign -vvv --strict "$binary"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/distrib/*.zip
            target/distrib/*.sha256

  attest:
    name: Attest artifacts
    needs:
      - plan
      - build
      - package-macos
    if: ${{ always() && needs.build.result == 'success' && needs.package-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256

      - name: Upload attested artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-attested
          path: artifacts/*

  publish:
    name: Publish GitHub Release
    needs:
      - plan
      - validate-release
      - build
      - package-macos
      - attest
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.validate-release.result == 'success' && needs.build.result == 'success' && needs.package-macos.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: artifacts-attested
          path: artifacts

      - name: Create release notes
        shell: bash
        env:
          MACOS_SIGNING: ${{ needs.plan.outputs.macos_signing }}
        run: |
          if [[ "$MACOS_SIGNING" == "true" ]]; then
            macos_status="The macOS artifacts in this release are Developer ID signed with the hardened runtime and accepted by Apple's notary service. Verify the SHA-256 checksum before running the binary."
          else
            macos_status="The macOS artifacts in this release are not Apple Developer ID signed and are not notarized because this release explicitly allowed unsigned macOS artifacts. Gatekeeper may warn on first run. Verify the SHA-256 checksum before running the binary."
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## md-to-pdf ${{ needs.plan.outputs.tag }}

          This release includes platform archives, SHA-256 checksum files, and GitHub artifact attestations.

          ### Changed

          - Blocked HTTP(S) assets referenced by Markdown, CSS, or raw HTML by default. Trusted documents can explicitly restore them with `--allow-remote-assets` or the matching MCP option; the built-in Mermaid CDN remains available.
          - Removed workflow-dispatch command injection from the release planner by validating tag input before any signing secret is available.
          - Pinned every release action to an immutable commit and isolated macOS signing/notarization onto fresh runners after secret-free builds.
          - Added browser-level SSRF regression tests, release-workflow structure tests, and macOS code-signing and notarization verification.

          ### Upgrade notes

          Remote document assets that previously loaded automatically now require `allow_remote_assets: true` (MCP) or `--allow-remote-assets` (CLI). This trusted-content opt-in permits requests to private and local networks. A custom Mermaid URL also requires the opt-in; the default Mermaid CDN and local `mermaid_js` bundles continue to work without it.

          ### macOS trust status

          MACOS_STATUS_PLACEHOLDER

          ### Verification

          Download the archive and matching `.sha256` file, then run `shasum -a 256 -c <file>.sha256` on macOS/Linux or `Get-FileHash` on Windows.
          NOTES
          python3 - <<'PY' "$RUNNER_TEMP/release-notes.md" "$macos_status"
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          status = sys.argv[2]
          path.write_text(path.read_text().replace("MACOS_STATUS_PLACEHOLDER", status))
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          target=$(git rev-parse HEAD)
          gh release create "$TAG" \
            --target "$target" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            artifacts/*

  dry-run-summary:
    name: Dry-run summary
    needs:
      - plan
      - validate-release
      - build
      - package-macos
      - attest
    if: ${{ always() && needs.plan.outputs.publishing == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: find artifacts -maxdepth 1 -type f -print | sort
