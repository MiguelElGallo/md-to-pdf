[package]
name = "md-to-pdf"
version = "0.7.1"
edition = "2021"
description = "Convert Markdown files with Mermaid diagrams to PDF using a browser renderer."
license = "MIT"
homepage = "https://miguelelgallo.github.io/md-to-pdf/"
repository = "https://github.com/MiguelElGallo/md-to-pdf"
documentation = "https://miguelelgallo.github.io/md-to-pdf/"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
camino = "1.1"
clap = { version = "4.5", features = ["derive", "env"] }
html-escape = "0.2"
pulldown-cmark = "0.12"
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
tungstenite = "0.24"
ureq = "2.10"
url = "2.5"
which = "7.0"

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
